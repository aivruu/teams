[versions]
# Versions set-up for gradle-plugins and required APIs and libraries.
shadow = "9.4.1"
spotless = "8.2.1"
indra = "4.0.0"
paperweight = "2.0.0-beta.21"
blossom = "2.2.0"
pluginyml = "0.9.0"

paper = "1.21.3-R0.1-SNAPSHOT"
packetevents = "2.12.0"
configurate = "4.2.0"

placeholder-legacy = "2.12.0"
placeholder-modern = "3.1.0"
bstats = "3.2.1"

annotations = "26.1.0"

mongodb = "5.6.5"
mariadb = "3.5.8"
hikaricp = "7.0.2"
caffeine = "3.2.3"

[libraries]
paper = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
packetevents = { module = "com.github.retrooper:packetevents-spigot", version.ref = "packetevents" }
configurate = { module = "org.spongepowered:configurate-hocon", version.ref = "configurate" }

placeholder-legacy = { group = "me.clip", name = "placeholderapi", version.ref = "placeholder-legacy" }
placeholder-modern = { group = "io.github.miniplaceholders", name = "miniplaceholders-api", version.ref = "placeholder-modern" }
bstats = { group = "org.bstats", name = "bstats-bukkit", version.ref = "bstats" }

annotations = { group = "org.jetbrains", name = "annotations", version.ref = "annotations" }

mongodb = { module = "org.mongodb:mongodb-driver-sync", version.ref = "mongodb"}
mariadb-driver = { group = "org.mariadb.jdbc", name = "mariadb-java-client", version.ref = "mariadb" }
hikaricp = { group = "com.zaxxer", name = "HikariCP", version.ref = "hikaricp" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }

build-indra = { module = "net.kyori:indra-common", version.ref = "indra" }
build-spotless = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
paperweight = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight" }
blossom = { id = "net.kyori.blossom", version.ref = "blossom"}
paper-plugin = { id = "de.eldoria.plugin-yml.paper", version.ref = "pluginyml" }
